<style>
:root{--ink:#172033;--muted:#5d6779;--line:#dfe4eb;--bg:#f2f4f7;--card:#fff;--accent:#0e7c66;--ok:#0e7c66}
@media (prefers-color-scheme:dark){:root{--ink:#e8ecf3;--muted:#9aa5b7;--line:#273142;--bg:#0e131b;--card:#151b25;--ok:#4fd1ae}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
main{max-width:620px;margin:0 auto;padding:48px 16px 64px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0 0 20px}
h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.status{font-size:19px;font-weight:600;margin:0 0 6px}.status.ok{color:var(--ok)}.status.ok::before{content:"\2713  "}
.status.busy::after{content:"";display:inline-block;width:14px;height:14px;margin-left:10px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.muted{color:var(--muted);margin:0}.small{font-size:14px}
.keycard:not(.open) h2{font-size:14px;color:var(--muted);font-weight:600}
.keyrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.keyrow code{flex:1 1 280px;min-width:0;overflow-wrap:anywhere;font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.btn{appearance:none;font:inherit;font-weight:600;border-radius:10px;padding:9px 16px;border:1px solid var(--line);background:var(--card);color:inherit;cursor:pointer;text-decoration:none;display:inline-block}
a{color:#0b5cad}@media (prefers-color-scheme:dark){a{color:#7ab4ff}}
:focus-visible{outline:2px solid #2f6fed;outline-offset:2px}
</style></head>
