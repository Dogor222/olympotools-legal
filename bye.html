<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer">
<title>OlympoTools</title>
<style>
:root{--ink:#172033;--muted:#5d6779;--line:#dfe4eb;--bg:#f2f4f7;--card:#fff;--accent:#0e7c66}
@media (prefers-color-scheme:dark){:root{--ink:#e8ecf3;--muted:#9aa5b7;--line:#273142;--bg:#0e131b;--card:#151b25}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
main{max-width:620px;margin:0 auto;padding:48px 20px 64px}
.head{display:flex;gap:14px;align-items:center;margin-bottom:22px}.head img{width:52px;height:52px;border-radius:14px}
h1{font-size:28px;line-height:1.15;letter-spacing:-.02em;margin:0}.lead{color:var(--muted);margin:14px 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
h2{font-size:17px;margin:0 0 12px}
.reasons{display:flex;flex-direction:column;gap:8px}
.reasons button{appearance:none;text-align:left;font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:11px;padding:11px 14px;cursor:pointer}
.reasons button:hover{border-color:var(--accent)}
.reasons button[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--card));font-weight:600}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
textarea{width:100%;min-height:90px;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 12px;resize:vertical}
.actions{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.btn{appearance:none;font:inherit;font-weight:600;border-radius:10px;padding:10px 18px;border:1px solid var(--line);background:var(--card);color:inherit;cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.done{font-weight:600}.small{font-size:13px;color:var(--muted)}
.more{margin-top:28px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:10px}
.grid a{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;background:var(--card);font-size:14px}
.grid img{width:28px;height:28px;border-radius:8px}
:focus-visible{outline:2px solid #2f6fed;outline-offset:2px}
</style></head>
<body><main id="app"></main>
<iframe name="sink" title="" hidden></iframe>
